name: Hostile ingestion run-history contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checked-not-wired-receipt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bind receipt to this exact source revision
        shell: sh
        run: |
          repository_revision=$(git rev-parse HEAD)
          sed "s/@IMPLEMENTATION_REVISION@/$repository_revision/" \
            parsers/hostile-ingestion/run.receipt.template.tsv \
            >"$RUNNER_TEMP/syllabi-ingestion.receipt.tsv"
      - name: Refuse to call an unrun search successful
        uses: isomorphisms/ai-ci/ingestion@c1e423d506f6adfc8c1c9659a4faaf94ae84eaf0
        with:
          receipt: ${{ runner.temp }}/syllabi-ingestion.receipt.tsv
          role: consumer
