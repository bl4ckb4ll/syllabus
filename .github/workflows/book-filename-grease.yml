name: book filename grease

on:
  push:
    paths:
      - 'where would I read this and who would I read it with/tools/book-filename.grease'
      - '.github/workflows/book-filename-grease.yml'
  pull_request:
    paths:
      - 'where would I read this and who would I read it with/tools/book-filename.grease'
      - '.github/workflows/book-filename-grease.yml'

jobs:
  book-filename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out syllabi
        uses: actions/checkout@v4

      - name: Check out Grease and its pinned source
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/grease
          path: grease
          submodules: recursive

      - name: Cache Grease development dependencies
        uses: actions/cache@v4
        with:
          path: grease/oils.DEPS
          key: grease-oils-deps-${{ runner.os }}-e9a54ad727d89cd593d0bfe56136046808ea81d2

      - name: Build Grease development runtime
        working-directory: grease/source
        run: |
          build/deps.sh wedge-deps-debian
          build/deps.sh fetch
          build/deps.sh install-wedges
          . build/dev-shell.sh
          build/py.sh minimal
          bin/osh -c 'echo Grease runtime ready'

      - name: Run book filename contract
        working-directory: grease/source
        run: |
          . build/dev-shell.sh
          bin/osh \
            '../../where would I read this and who would I read it with/tools/book-filename.grease' \
            --self-test
