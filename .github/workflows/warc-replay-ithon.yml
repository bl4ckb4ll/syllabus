name: Qualify Ithon WARC replay
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ithon-warc-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Record the candidate revision
        run: |
          echo "Candidate commit: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Check out pinned Ithon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: .tooling/ithon
      - name: Build pinned Ithon
        working-directory: .tooling/ithon
        run: |
          ./configure --without-ensurepip
          make -j2
      - name: Check out independent AICI acquisition acceptance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: c9cd9bb0e8e1ad91af5ad45cf1ae8e5df376b9e5
          path: .tooling/aici-acquisition
      - name: Execute synthetic positive, hostile negative, and file-retry controls in Ithon
        uses: ./examples/autogenerated/warc-qualification
      - name: Retain native replay and frontend receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ithon-warc-qualification
          path: warc-qualification-results/
          if-no-files-found: error
