name: Evidence inventory
on:
  push:
    branches: [sun/inv-01-evidence-inventory]
  pull_request:
permissions:
  contents: read
jobs:
  source-and-aici:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check out exact push head
        if: github.event_name == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check out qualified host Ithon interface
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: .tooling/ithon
      - name: Check out independent AICI verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: e60a207624aef5d3d972dc65b2d9a7dca3521a80
          path: .tooling/ai-ci
      - name: Verify actual source objects and every rejection control
        uses: ./examples/autogenerated/inventory-reconciliation
